<div class="rgc-page">
  <div class="rgc-header">
    <div class="rgc-header-icon">📁</div>
    <div class="rgc-header-text">
      <h2>폴더 복사 (rclone G2G)</h2>
      <p>rclone을 이용해 구글 드라이브 폴더/파일을 다른 구글 드라이브 위치로 서버사이드 복사하거나, 서버(또는 로컬 드라이브)로 그대로 다운로드하거나, 폴더 안의 압축파일들을 다운로드해 일괄 압축 해제합니다.</p>
    </div>
  </div>

  <div class="rgc-config-banner" data-role="config-banner">
    설정을 확인하는 중...
  </div>

  <div class="rgc-card">
    <div class="rgc-field rgc-source-kind-field">
      <span class="rgc-field-legend">소스 종류</span>
      <div class="rgc-radio-group" data-role="source-shape-group" role="radiogroup" aria-label="소스 종류">
        <label class="rgc-radio">
          <input type="radio" name="rgc-source-shape" value="folder" data-role="source-shape-folder" checked />
          <span>📁 구글 드라이브 폴더</span>
        </label>
        <label class="rgc-radio">
          <input type="radio" name="rgc-source-shape" value="file" data-role="source-shape-file" />
          <span>📦 구글 드라이브 개별 파일</span>
        </label>
      </div>
    </div>

    <div class="rgc-field rgc-dest-kind-field">
      <span class="rgc-field-legend">목적지 종류</span>
      <div class="rgc-radio-group" data-role="dest-kind-group" role="radiogroup" aria-label="목적지 종류">
        <label class="rgc-radio">
          <input type="radio" name="rgc-dest-kind" value="remote" data-role="dest-kind-remote" checked />
          <span>☁️ 구글 드라이브 (원격으로 복사)</span>
        </label>
        <label class="rgc-radio">
          <input type="radio" name="rgc-dest-kind" value="local" data-role="dest-kind-local" />
          <span>💾 로컬 (그대로 다운로드)</span>
        </label>
        <label class="rgc-radio">
          <input type="radio" name="rgc-dest-kind" value="local_extract" data-role="dest-kind-local-extract" />
          <span>📂 로컬 (압축 해제)</span>
        </label>
      </div>
    </div>

    <div class="rgc-field">
      <label for="rgc-source-url" data-role="source-label">소스 폴더 (구글 드라이브 URL 또는 폴더 ID)</label>
      <input
        type="text"
        id="rgc-source-url"
        data-role="source-url"
        placeholder="https://drive.google.com/drive/folders/xxxxxxxxxxxx"
        autocomplete="off"
      />
      <p class="rgc-field-hint" data-role="source-kind-hint"></p>
    </div>

    <div class="rgc-field">
      <label for="rgc-dest-folder" data-role="dest-label">목적지 경로 (도커/호스트 마운트 경로 또는 rclone 기준 상대 경로 둘 다 입력 가능)</label>
      <input
        type="text"
        id="rgc-dest-folder"
        data-role="dest-folder"
        placeholder="/mnt/zeeps_member/zeepsmember/공유_폴더명 또는 /zeepsmember/공유_폴더명"
        autocomplete="off"
      />
      <p class="rgc-dest-preview" data-role="dest-preview"></p>
    </div>

    <button type="button" class="rgc-start-btn" data-role="start-btn">복사 시작</button>
    <button type="button" class="rgc-cancel-btn" data-role="cancel-btn" hidden>중단</button>
    <span class="rgc-status-text" data-role="status-text"></span>
    <button type="button" class="rgc-reset-link" data-role="reset-btn" hidden>강제 초기화</button>

    <div class="rgc-progress-wrap" data-role="progress-wrap" hidden>
      <div class="rgc-progress-head">
        <span class="rgc-progress-percent" data-role="progress-percent">0%</span>
        <span class="rgc-progress-summary" data-role="progress-summary"></span>
      </div>
      <div class="rgc-progress-track">
        <div class="rgc-progress-fill" data-role="progress-fill" style="width: 0%"></div>
      </div>
      <div class="rgc-progress-detail" data-role="progress-detail"></div>
    </div>
  </div>

  <div class="rgc-log-card">
    <div class="rgc-log-head">
      <span class="rgc-log-head-title">실행 로그</span>
      <span class="rgc-log-dest" data-role="log-dest"></span>
    </div>
    <pre class="rgc-log-box" data-role="log-box">복사를 시작하면 이곳에 진행 상황이 표시됩니다.</pre>
  </div>
</div>
